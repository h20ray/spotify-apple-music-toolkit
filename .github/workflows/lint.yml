name: Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy types-requests
          pip install -r requirements.txt
      - name: flake8
        run: flake8 toolkit --max-line-length=120 --extend-ignore=E203,W503
      - name: mypy
        run: mypy toolkit || true
